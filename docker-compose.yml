name: stockroom
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-before-deployment}
    DATABASE_URL: postgresql://b2b:${POSTGRES_PASSWORD:-b2b_dev_only}@db:5432/b2b
    REDIS_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    FRONTEND_URL: http://localhost:5173
    EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: b2b
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U b2b -d b2b]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *backend
    command: sh -c 'python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000'
    ports:
      - 127.0.0.1:8000:8000
  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
  frontend:
    image: node:22-bookworm-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
      - frontend_modules:/site/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    command: sh -c 'npm ci --no-audit --no-fund && npm run dev'
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - backend
volumes:
  postgres_data:
  redis_data:
  frontend_modules:
