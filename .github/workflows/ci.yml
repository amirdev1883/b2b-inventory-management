name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, dev, 'feat/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: b2b
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b2b -d b2b"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://b2b:b2b_ci_only@127.0.0.1:5432/b2b
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev]'
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgresql://b2b:b2b_ci_only@127.0.0.1:5432/b2b
      - name: Verify Celery can connect to Redis
        shell: bash
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          cd backend
          celery -A config worker --loglevel=info --pool=solo --hostname=ci@localhost > /tmp/celery.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          python - <<'PYTHON'
          import time
          from config.celery import app
          for attempt in range(20):
              if app.control.inspect(timeout=1).ping():
                  break
              time.sleep(1)
          else:
              raise SystemExit('Celery worker did not become ready')
          PYTHON
      - name: Build production image
        run: docker build --file backend/Dockerfile --target production --tag stockroom:ci .
      - name: Check production configuration
        run: >-
          docker run --rm --network host
          -e DJANGO_SECRET_KEY=ci-only-not-a-production-secret-012345678901234567890123456789
          -e DJANGO_ALLOWED_HOSTS=127.0.0.1
          -e DATABASE_URL -e REDIS_URL
          stockroom:ci python manage.py check --deploy --fail-level WARNING
      - name: Smoke test packaged frontend and API
        shell: bash
        run: |
          docker run --detach --rm --network host --name stockroom-smoke \
            -e DJANGO_SECRET_KEY=ci-only-not-a-production-secret-012345678901234567890123456789 \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1 -e DATABASE_URL -e REDIS_URL \
            -e TRUST_PROXY_HEADERS=true stockroom:ci
          trap 'docker stop stockroom-smoke || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready/; then break; fi
            sleep 1
          done
          python - <<'PYTHON'
          import re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          origin = 'http://127.0.0.1:8000'
          def get(path):
              return urlopen(Request(origin + path, headers={'X-Forwarded-Proto': 'https'}), timeout=10)
          with get('/') as response:
              html = response.read().decode()
          assets = re.findall(r'(?:src|href)="(/static/[^" ]+)"', html)
          assert assets, 'Compiled interface assets are missing'
          for asset in assets:
              with get(asset) as response:
                  assert response.status == 200
          try:
              get('/api/products/')
          except HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Anonymous inventory access must be denied')
          PYTHON
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            frontend/test-results
            /tmp/celery.log
